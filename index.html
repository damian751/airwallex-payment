<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAHAYU | K-Beauty 韩国美妆</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --blush: #f2c4c4;
      --rose: #c97b7b;
      --deep: #6b2d2d;
      --cream: #fdf6f0;
      --gold: #c9a96e;
      --white: #ffffff;
      --soft: #f9ece8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: var(--cream); color: var(--deep); min-height: 100vh; overflow-x: hidden; }
    .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 24px 40px; background: linear-gradient(160deg, #fdf6f0 0%, #fae8e8 50%, #f2d9d9 100%); overflow: hidden; }
    .hero::before { content: ''; position: absolute; top: -80px; right: -80px; width: 320px; height: 320px; background: radial-gradient(circle, rgba(242,196,196,0.6) 0%, transparent 70%); border-radius: 50%; }
    .hero::after { content: ''; position: absolute; bottom: -60px; left: -60px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(201,161,110,0.25) 0%, transparent 70%); border-radius: 50%; }
    .badge { display: inline-block; background: var(--gold); color: var(--white); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; padding: 6px 18px; border-radius: 20px; margin-bottom: 24px; animation: fadeDown 0.6s ease both; }
    .logo { font-family: 'Playfair Display', serif; font-size: clamp(48px, 14vw, 96px); font-weight: 700; color: var(--deep); line-height: 1; letter-spacing: -2px; animation: fadeDown 0.7s ease 0.1s both; }
    .logo span { color: var(--rose); font-style: italic; }
    .tagline-kr { font-size: clamp(13px, 3.5vw, 16px); color: var(--rose); letter-spacing: 4px; margin-top: 8px; font-weight: 300; animation: fadeDown 0.7s ease 0.2s both; }
    .tagline-cn { font-size: clamp(18px, 5vw, 26px); color: var(--deep); margin-top: 20px; font-weight: 500; line-height: 1.5; animation: fadeDown 0.7s ease 0.3s both; }
    .tagline-cn small { display: block; font-size: clamp(13px, 3.5vw, 15px); color: var(--rose); font-weight: 300; margin-top: 6px; }
    .divider { width: 60px; height: 2px; background: linear-gradient(90deg, var(--blush), var(--gold)); margin: 28px auto; border-radius: 2px; animation: fadeDown 0.7s ease 0.35s both; }
    .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 380px; width: 100%; margin: 0 auto 32px; animation: fadeUp 0.8s ease 0.4s both; }
    .product-card { background: var(--white); border-radius: 16px; padding: 16px 10px; text-align: center; box-shadow: 0 4px 20px rgba(107,45,45,0.08); transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(107,45,45,0.14); }
    .product-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .product-name { font-size: 11px; color: var(--deep); font-weight: 500; line-height: 1.3; }
    .product-name-cn { font-size: 10px; color: var(--rose); margin-top: 2px; }
    .features { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 36px; animation: fadeUp 0.8s ease 0.5s both; }
    .feature { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--rose); }
    .feature::before { content: '✓'; background: var(--blush); color: var(--deep); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .cta-wrap { animation: fadeUp 0.8s ease 0.55s both; width: 100%; max-width: 340px; }
    .cta-btn { display: block; width: 100%; background: linear-gradient(135deg, var(--deep) 0%, var(--rose) 100%); color: var(--white); text-decoration: none; font-size: 17px; font-weight: 500; letter-spacing: 1px; padding: 18px 32px; border-radius: 50px; box-shadow: 0 8px 30px rgba(107,45,45,0.35); transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative; overflow: hidden; }
    .cta-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transition: left 0.5s ease; }
    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(107,45,45,0.45); }
    .cta-btn:hover::before { left: 100%; }
    .cta-btn:active { transform: scale(0.98); }
    .cta-sub { font-size: 11px; color: var(--rose); margin-top: 10px; text-align: center; }
    .payment-icons { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; animation: fadeUp 0.8s ease 0.65s both; }
    .pay-icon { background: var(--white); border: 1px solid var(--blush); border-radius: 10px; padding: 6px 14px; font-size: 12px; color: var(--deep); font-weight: 500; display: flex; align-items: center; gap: 5px; }
    .bottom-strip { background: var(--deep); color: rgba(255,255,255,0.7); text-align: center; padding: 14px 20px; font-size: 11px; letter-spacing: 1px; }
    .bottom-strip span { color: var(--gold); }
    .petal { position: absolute; width: 8px; height: 8px; background: var(--blush); border-radius: 50% 0 50% 0; opacity: 0.5; animation: float linear infinite; }
    @keyframes float { 0% { transform: translateY(0) rotate(0deg); opacity: 0.5; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .pulse-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; border-radius: 50px; border: 2px solid rgba(107,45,45,0.3); animation: pulse-out 2s ease-out infinite; pointer-events: none; }
    @keyframes pulse-out { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0; } }
  </style>
</head>
<body>
<div class="hero">
  <div class="petal" style="left:10%; bottom:0; animation-duration:8s; animation-delay:0s;"></div>
  <div class="petal" style="left:25%; bottom:0; width:10px; height:10px; animation-duration:11s; animation-delay:2s;"></div>
  <div class="petal" style="left:60%; bottom:0; width:7px; height:7px; animation-duration:9s; animation-delay:1s;"></div>
  <div class="petal" style="left:80%; bottom:0; width:5px; height:5px; animation-duration:12s; animation-delay:3s;"></div>
  <div class="badge">🇰🇷 OFFICIAL K-BEAUTY STORE</div>
  <div class="logo">ZA<span>HA</span>YU</div>
  <div class="tagline-kr">자하유 · 韩国美妆</div>
  <div class="tagline-cn">专为中国客户精选<br>正品韩国美妆护肤<small>直邮 · 正品保证 · 安全支付</small></div>
  <div class="divider"></div>
  <div class="products">
    <div class="product-card"><span class="product-icon">🌸</span><div class="product-name">Skincare</div><div class="product-name-cn">护肤精华</div></div>
    <div class="product-card"><span class="product-icon">💄</span><div class="product-name">Makeup</div><div class="product-name-cn">彩妆产品</div></div>
    <div class="product-card"><span class="product-icon">✨</span><div class="product-name">K-Brand</div><div class="product-name-cn">韩国品牌</div></div>
  </div>
  <div class="features">
    <div class="feature">正品保证</div>
    <div class="feature">安全支付</div>
    <div class="feature">极速发货</div>
  </div>
  <div class="cta-wrap">
    <a href="https://pay.airwallex.com/hkhigixuqwdb" class="cta-btn">
      <div class="pulse-ring"></div>
      立即购买 · Pay Now
    </a>
    <p class="cta-sub">支持微信支付 · 支付宝 · 信用卡</p>
  </div>
  <div class="payment-icons">
    <div class="pay-icon">💚 微信支付</div>
    <div class="pay-icon">🔵 支付宝</div>
    <div class="pay-icon">💳 Card</div>
  </div>
</div>
<div class="bottom-strip">© 2026 <span>ZAHAYU LIMITED</span> · 韩国美妆 · 安全加密支付</div>
</body>
</html>
