<!DOCTYPE html>
<html>
<head>
  <title>Secure Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; background: #f5f5f5; }
    h2 { color: #333; }
    #pay-btn { background: #000; color: #fff; padding: 15px 30px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    #qr { margin-top: 20px; }
    p { color: #666; }
  </style>
</head>
<body>
  <h2>Secure Payment</h2>
  <p>Scan QR code or click button to pay with WeChat Pay or Alipay</p>
  <div id="qr"></div>
  <br>
  <button id="pay-btn" onclick="startPayment()">Pay Now</button>

  <script>
    async function startPayment() {
      try {
        const response = await fetch('/api/payment');
        const data = await response.json();
        const paymentUrl = `https://checkout.airwallex.com/?client_secret=${data.client_secret}`;
        window.location.href = paymentUrl;
      } catch (error) {
        alert('Payment error. Please try again.');
      }
    }
  </script>
</body>
</html>
